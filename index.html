<style>
/* Layout: pantalla fija de app móvil. Organismo flotando en el centro, cinco subconceptos abajo como catalizadores. */
:root{
  --paper:#F7F7F4; --ink:#111111; --mute:#6F6F74; --line:#DADAD5; --card:#FFFFFF;
  --aire:#79F2F4; --tierra:#EFD74F; --agua:#4F8FEF; --fuego:#FF0000; --corazon:#FF00B2;
  --body:'Inter', system-ui, -apple-system, sans-serif;
  --f-aire:'Comfortaa', system-ui, sans-serif; --f-tierra:'Rubik Dirt', Impact, sans-serif; --f-agua:'Caveat', cursive; --f-fuego:'Permanent Marker', cursive; --f-corazon:'Rubik Glitch', 'Bangers', Impact, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#121214; --ink:#F2F2EE; --mute:#9A9AA2; --line:#2A2A30; --card:#1B1B20; color-scheme:dark } }
:root[data-theme="dark"]{ --paper:#121214; --ink:#F2F2EE; --mute:#9A9AA2; --line:#2A2A30; --card:#1B1B20; color-scheme:dark }
html,body{height:100%;overflow:hidden}
html{height:100vh;height:100dvh;height:var(--app-h,100dvh)} /* alto real visible: en el celular las barras del navegador no tapan los botones */
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--agua);outline-offset:2px}
.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:8px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:10px 14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:0 0 auto}
.wordmark{display:flex;align-items:baseline;gap:6px;font-weight:900;font-size:22px;line-height:.9;letter-spacing:-.04em;text-transform:uppercase}
.wordmark svg{width:.71em;height:.73em;overflow:visible}
.chip{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border:1.5px solid var(--ink);border-radius:999px}
.stage{position:relative;flex:1 1 0;min-height:0;overflow:hidden;border-radius:18px}
canvas.org{display:block;touch-action:none;width:100%;height:100%}
.prompt{position:absolute;left:0;right:0;top:24%;text-align:center;pointer-events:none;padding:0 8px;animation:scrIn .5s ease both;transition:opacity .6s}
.prompt b{display:block;font-weight:800;font-size:clamp(17px,5vw,20px);line-height:1.2;letter-spacing:-.01em}
.prompt span{display:block;margin-top:4px;font-size:13px;color:var(--mute)}
.prompt.off{opacity:0}
.hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;color:var(--mute);pointer-events:none;letter-spacing:.04em}
.word{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:clamp(44px,16vw,80px);line-height:1;text-align:center;opacity:0;transform:scale(.7);transition:opacity .25s,transform .25s}
.word.show{opacity:1;transform:scale(1)}
.info{flex:0 0 auto;min-width:0}
h1.name{font-weight:800;letter-spacing:-.02em;font-size:clamp(20px,6vw,26px);line-height:1.1;margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.desc{color:var(--mute);margin:2px 0 0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px;color:var(--mute);white-space:nowrap}
.meter .bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.meter .bar i{display:block;height:100%;transition:width .5s}
.concepts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:0 0 auto;margin-top:4px}
.concept{aspect-ratio:1/1.05;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;color:#F2F2EE;background:#1B1B20;border:1px solid #2E2E36;transition:transform .1s;min-width:0;overflow:hidden;position:relative}
.concept:active{transform:scale(.94)}
.concept .k{font-size:13px;line-height:1;white-space:nowrap;max-width:100%}
.concept .e{font-family:var(--body);font-size:12px;letter-spacing:.02em;font-weight:600;color:#fff}
.concept .ic{width:32px;height:32px;display:block;overflow:visible}
.concept .n{position:absolute;top:5px;right:7px;font-size:10px;font-weight:700;color:#fff;opacity:.8}
.actions{display:grid;grid-template-columns:1fr;gap:8px;flex:0 0 auto}
.btn{padding:12px 14px;border-radius:14px;font-weight:600;font-size:16px;text-align:center;border:1.5px solid var(--ink);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--corazon);color:#fff;border-color:var(--corazon);font-weight:800;font-size:18px;letter-spacing:.02em;padding:15px 13px}
/* palabras clave en su tipografía */
.w-aire{font-family:var(--f-aire);font-weight:300;letter-spacing:.08em;color:var(--aire)}
.w-tierra{font-family:var(--f-tierra);color:var(--tierra)}
.w-agua{font-family:var(--f-agua);font-weight:700;color:var(--agua)}
.w-fuego{font-family:var(--f-fuego);color:var(--fuego)}
.w-corazon{color:var(--corazon);display:inline-block}
.w-corazon span{display:inline-block}
.concept .w-aire,.concept .w-tierra,.concept .w-agua,.concept .w-fuego,.concept .w-corazon{color:#111}
.sheet{position:fixed;inset:0;background:rgba(17,17,17,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet .panel{width:100%;max-width:480px;background:var(--paper);border-radius:22px 22px 0 0;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:14px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;max-height:92dvh;overflow-y:auto;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.sheet h2{font-size:clamp(40px,14vw,64px);font-weight:400;margin:2px 0 0;line-height:1}
.sheet p{margin:6px 0 0;color:var(--mute);font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:10px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);min-width:0}
.opt:active{border-color:var(--ink)}
.opt canvas{width:92px;height:92px;border-radius:12px}
.opt b{font-weight:700;font-size:15px;display:block}
.opt small{color:var(--mute);font-size:12px;line-height:1.3}
.opt.full{grid-column:1/-1;flex-direction:row;text-align:left}
.power-btn{position:relative;font-weight:800;letter-spacing:.04em;border-color:var(--corazon);background:var(--card);color:var(--ink);animation:glow 6s linear infinite}
@keyframes glow{
 0%,100%{box-shadow:inset 0 0 18px 2px rgba(255,0,178,.6),inset 0 0 3px rgba(255,255,255,.55),0 0 14px rgba(255,0,178,.3)}
 20%{box-shadow:inset 0 0 18px 2px rgba(121,242,244,.65),inset 0 0 3px rgba(255,255,255,.55),0 0 14px rgba(121,242,244,.3)}
 40%{box-shadow:inset 0 0 18px 2px rgba(239,215,79,.65),inset 0 0 3px rgba(255,255,255,.55),0 0 14px rgba(239,215,79,.3)}
 60%{box-shadow:inset 0 0 18px 2px rgba(79,143,239,.7),inset 0 0 3px rgba(255,255,255,.55),0 0 14px rgba(79,143,239,.3)}
 80%{box-shadow:inset 0 0 18px 2px rgba(255,0,0,.6),inset 0 0 3px rgba(255,255,255,.55),0 0 14px rgba(255,0,0,.3)}}
@media (prefers-reduced-motion:reduce){.power-btn{animation:none;box-shadow:inset 0 0 18px 2px rgba(255,0,178,.6),inset 0 0 3px rgba(255,255,255,.55)}}
/*RF_CSS*/
.rf-pill{font:inherit;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 11px;border-radius:999px;border:1.5px solid var(--corazon);color:var(--ink);background:var(--card);animation:glow 6s linear infinite}
.rf-unlock{position:fixed;inset:0;z-index:70;background:#05060c;color:#F2F2EE;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden;animation:rfIn .8s ease both}
.rf-glow{position:absolute;inset:-20%;background:radial-gradient(circle at 50% 42%,rgba(255,0,178,.3),transparent 45%),radial-gradient(circle at 30% 70%,rgba(79,143,239,.24),transparent 40%),radial-gradient(circle at 75% 65%,rgba(121,242,244,.18),transparent 38%);animation:rfGlow 9s ease-in-out infinite alternate}
.rf-in{position:relative;width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:10px}
.rf-ico{width:64px;height:64px;color:var(--corazon);margin-bottom:4px}
.rf-unlock .eyebrow{color:#C6C6CE}
.rf-unlock h2{font-family:var(--body);font-weight:900;font-size:clamp(46px,15vw,64px);letter-spacing:-.04em;line-height:1;margin:0}
.rf-unlock p{color:#C6C6CE;line-height:1.5;margin:6px 0 14px}.rf-unlock p b{color:#fff}
.rf-tip{display:block;color:#8E8EA0;font-size:12px;line-height:1.4;margin:-4px 0 14px}
.rf-unlock .btn{width:100%}.rf-unlock .close{color:#9A9AA2}
.refugio{position:fixed;inset:0;z-index:72;background:linear-gradient(180deg,#04051a 0%,#0b1033 55%,#03040e 100%);color:#F2F2EE;overflow:hidden;animation:rfIn 1.2s ease both}
#rf-bg{position:absolute;left:0;top:0;filter:blur(16px);opacity:.95}
#rf-cv{position:absolute;left:0;top:0}
.rf-leaving .rf-top,.rf-leaving .rf-bot,.rf-leaving .rf-breath{opacity:0;transition:opacity 1s}
.cg-hint{font-weight:700;color:var(--corazon)!important}
.rf-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:max(16px,env(safe-area-inset-top,0px)) 18px 0}
.rf-top .eyebrow{color:#9A9AA2}
.rf-top h2{font-family:var(--body);font-weight:900;font-size:26px;letter-spacing:-.03em;margin:2px 0 0}
.rf-top .btn,.rf-bot .btn{border-color:rgba(242,242,238,.5);color:#F2F2EE;background:rgba(0,0,0,.25)}
.rf-top .btn{padding:9px 14px;font-size:15px}
.rf-breath{position:absolute;left:0;right:0;bottom:calc(176px + env(safe-area-inset-bottom,0px));text-align:center;font-size:clamp(38px,12vw,60px);font-weight:300;letter-spacing:.26em;text-transform:uppercase;color:#E8E8F6;text-shadow:0 0 22px rgba(190,170,255,.55)}
.rf-bot{position:absolute;left:0;right:0;bottom:0;padding:0 18px max(18px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;align-items:center}
.rf-bot .btn{padding:10px 18px;font-size:14px}
.rf-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.rf-chips span{font-size:12px;padding:4px 10px;border:1px solid rgba(242,242,238,.25);border-radius:999px;color:#C6C6CE;opacity:0;animation:rfChip 1.4s ease forwards}
@keyframes rfIn{from{opacity:0}to{opacity:1}}
@keyframes rfGlow{from{transform:translate(-3%,-2%) scale(1)}to{transform:translate(3%,2%) scale(1.08)}}
@keyframes rfChip{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.rf-glow,.rf-pill{animation:none}}
/*RF_CSS_END*/
.fxtitle{position:fixed;left:0;right:0;top:34%;text-align:center;z-index:60;pointer-events:none;font-weight:900;font-size:clamp(38px,12vw,72px);letter-spacing:-.03em;color:var(--corazon);text-shadow:0 0 24px rgba(255,0,178,.7),0 0 4px #fff;animation:fxpop 1.9s ease both}
@keyframes fxpop{0%{opacity:0;transform:scale(.4) rotate(-6deg)}15%{opacity:1;transform:scale(1.15) rotate(2deg)}30%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.1) translateY(-14px)}}
.shake{animation:shk .12s linear infinite}
@keyframes shk{0%{transform:translate(0,0)}25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,-2px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}

.logo .ch{display:inline-block;animation:bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*-.22s);transform-origin:50% 100%}
.logo .lf1,.logo .lf2{transform-box:fill-box;transform-origin:10% 95%;animation:sway 3.2s ease-in-out infinite}
.logo .lf2{animation-delay:-1.1s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-.09em) rotate(-3deg)}65%{transform:translateY(.02em) rotate(2.5deg)}}
@keyframes sway{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(5deg) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.logo .ch,.logo .lf1,.logo .lf2{animation:none}}
.intro .wordmark{justify-content:center;font-size:40px}.intro .wordmark svg{width:40px;height:40px}
.intro canvas{width:min(320px,34vh);height:min(320px,34vh);width:min(320px,34dvh);height:min(320px,34dvh);margin:8px auto 0;display:block;touch-action:none}
.intro p{max-width:34ch;margin:10px auto 0;color:var(--mute);font-size:15px}
.intro h1{font-weight:700;font-size:24px;letter-spacing:-.015em;margin:8px 0 0}
.intro p{color:#C4C4CB}
.intro .field{width:100%;max-width:300px;margin:18px auto 0}
.intro .field label{color:#C4C4CB;font-size:13px;margin-bottom:8px}
.intro .field input{border-radius:999px;padding:12px 18px;font-size:16px;text-align:center;border:1px solid #3A3A42;background:rgba(27,27,32,.9)}
.intro .field input:focus-visible{border-color:var(--agua);box-shadow:0 0 0 1px var(--agua)}
.intro .actions{width:100%;max-width:300px;margin-left:auto;margin-right:auto}
.intro .btn.primary{border-radius:999px;font-weight:600;font-size:16px;letter-spacing:.01em;padding:13px 22px;border-width:0}
.welcome{display:flex;flex-direction:column;justify-content:safe center;height:100%;text-align:center;overflow-y:auto;scrollbar-width:none;padding:8px 0}
.welcome::-webkit-scrollbar{display:none}
.welcome .logo{flex:0 0 auto;font-size:clamp(40px,10vh,64px);font-size:clamp(40px,10dvh,64px);margin-bottom:clamp(16px,3dvh,32px)}
.welcome h1{font-weight:800;font-size:clamp(24px,7vw,30px);line-height:1.15;letter-spacing:-.02em;margin:0 0 18px}
.welcome p{max-width:36ch;margin:0 auto 14px;color:var(--mute);font-size:15px;line-height:1.5}
.welcome .ask{font-weight:800;color:var(--ink);font-size:19px;margin:10px auto 16px}
.welcome .actions{margin-top:2px;flex:0 0 auto}
.screen-in{animation:scrIn .6s ease both}
.screen-out{opacity:0;transform:translateY(-10px);transition:opacity .35s,transform .35s}
@keyframes scrIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen-in{animation:none}.screen-out{transition:none}}
@media (prefers-reduced-motion: reduce){ .sheet .panel{animation:none} }

// fondo de celebración: confeti en los cinco colores, con opacidad
function paintBg(){const c=document.getElementById('bg');if(!c)return;const dpr=Math.min(2,devicePixelRatio||1),w=innerWidth,h=innerHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
 const cols=['#79F2F4','#EFD74F','#4F8FEF','#FF0000','#FF00B2'];let sd=7;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
 const n=Math.round(w*h/2600);
 for(let i=0;i<n;i++){const px=R()*w,py=R()*h,s=5+R()*13,a=R()*6.28;x.save();x.translate(px,py);x.rotate(a);x.globalAlpha=.05+R()*.08;x.fillStyle=x.strokeStyle=cols[(R()*5)|0];const k=R();
  if(k<.28){x.beginPath();x.arc(0,0,s*.42,0,7);x.fill()}
  else if(k<.55){x.fillRect(-s/2,-s/5,s,s*.4)}

  else{x.lineWidth=s*.16;x.lineCap='round';x.beginPath();x.moveTo(-s*.6,0);x.bezierCurveTo(-s*.3,-s*.5,s*.1,s*.5,s*.6,0);x.stroke()}
  x.restore()}}
addEventListener('resize',paintBg);
const CONCEPTS=[
 {id:'aire',name:'Aire',word:'conectar',color:'#79F2F4',cls:'w-aire',intro:'Hilos finos que unen cosas que estaban lejos.',
  elements:[

 {id:'tierra',name:'Tierra',word:'cuidar',color:'#EFD74F',cls:'w-tierra',intro:'Lo que se cuida echa raíces.',

 {id:'agua',name:'Agua',word:'transformar',color:'#4F8FEF',cls:'w-agua',intro:'Nada queda igual después de pasar por el agua.',

   {label:'Cuadrado',desc:'Cuadrados anidados que giran.',delta:{squares:1}},
   {label:'Gota',desc:'Gotas que caen de vos.',delta:{drops:6}},

 {id:'fuego',name:'Fuego',word:'hacer',color:'#FF0000',cls:'w-fuego',intro:'Hacer es dejar marca.',

 {id:'corazon',name:'Corazón',word:'celebrar',color:'#FF00B2',cls:'w-corazon',intro:'Celebrar es hacerse ver.',

];
const BASE={core:1.55,wobble:.25,filaments:0,dragonfly:0,lattice:0,facets:0,wings:0,branches:0,wheels:0,spin:0,grain:0,fibers:0,lobes:0,spiral:0,arms:0,squares:0,drops:0,ripples:0,dots:0,brush:0,glitch:0,sparks:0,diamonds:0,spikes:0,marble:0,glow:0,confetti:0,shine:0};
const TRAITS=Object.keys(BASE);

const INK='#111111',SEED='#B4B4BE',PAPER='#F7F7F4';
const isDark=()=>{if(window.__mapDark)return true;const t=document.documentElement.dataset.theme;return t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)};

// ------------------------------------------------------------------
// ESTADO
// ------------------------------------------------------------------
let S=load()||fresh();
function fresh(){return {name:'',seed:Math.floor(Math.random()*1e6),traits:{...BASE},history:[],mix:{},started:false,refugio:false,refugioSeen:false}}
function load(){try{const j=localStorage.getItem('catalisis2');return j?JSON.parse(j):null}catch(e){return null}}
function save(){try{localStorage.setItem('catalisis2',JSON.stringify(S))}catch(e){}}
let D={...S.traits};let particles=[];
function stageOf(n){let s=STAGES[0];for(const st of STAGES)if(n>=st[0])s=st;return s}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return [n>>16,n>>8&255,n&255]}
function rgb2hex(r){return '#'+r.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('')}
function hexA(h,a){const [r,g,b]=hex2rgb(h);return `rgba(${r},${g},${b},${a})`}
// mezcla de colores: pesos por subconcepto → color único
function mixColor(mix){let tot=0,acc=[0,0,0];for(const c of CONCEPTS){const w=mix[c.id]||0;if(!w)continue;tot+=w;const rgb=hex2rgb(c.color);for(let i=0;i<3;i++)acc[i]+=rgb[i]*w}
 return tot?rgb2hex(acc.map(v=>v/tot)):SEED}
function topConcepts(mix){return CONCEPTS.filter(c=>mix[c.id]).sort((a,b)=>mix[b.id]-mix[a.id])}
function autoName(){const n=S.history.length,st=stageOf(n)[1],tc=topConcepts(S.mix);
 if(!tc.length)return st;if(tc.length===1)return `${st} de ${tc[0].name}`;return `${st} de ${tc[0].name} y ${tc[1].name}`}

// ------------------------------------------------------------------
// DIBUJO
// ------------------------------------------------------------------
function rnd(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
let FX={dentA:0,dentM:0,squash:0,bubble:0};
function blobPath(ctx,cx,cy,R,T,t,seed){
 ctx.beginPath();const wob=T.wobble*(1+FX.squash*2.2)*(1-FX.bubble*.6);const arms=Math.round(T.arms);
 for(let i=0;i<=120;i++){const a=i/120*Math.PI*2;
  let r=R*(1+wob*.38*Math.sin(3*a+seed)+wob*.18*Math.sin(5*a-t*1.3)+.025*Math.sin(t*2)+FX.squash*.12*Math.sin(11*a+t*9));
  if(arms>0)r*=1+Math.min(1,T.arms)*.9*Math.max(0,Math.cos(arms*(a-t*.15)))**3;
  if(FX.dentM>0){const c=Math.cos(a-FX.dentA);r*=1-FX.dentM*.55*Math.max(0,c)**2+FX.dentM*.25*Math.max(0,-c)**2}
  const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
 ctx.closePath()}
function draw(ctx,size,T,t,mix,seed,paper){
 const cx=size/2,cy=size/2,R=size*.13*T.core*(1+FX.bubble*.25)*(1-FX.squash*.2);
 const rr=rnd(seed+7);const base=mixColor(mix);const tc=topConcepts(mix);const c2=tc[1]?tc[1].color:base;const c1=tc[0]?tc[0].color:base;
 const dark=!paper&&isDark(),BL=dark?'#6FA2F5':'#1E3BC2',OUT=dark?"#F2F2EE":INK,PA=paper||(dark?"#121214":PAPER);
 const A3=!!(window.B3D&&size>120);
 if(window.B3D&&size>200){ctx.save();ctx.translate(cx,cy);ctx.rotate(-(V.rot||0));ctx.translate(0,R*2.25);ctx.scale(1,.2);
  let gs=ctx.createRadialGradient(0,0,0,0,0,R*1.6);gs.addColorStop(0,hexA(base,.28));gs.addColorStop(1,hexA(base,0));ctx.fillStyle=gs;ctx.beginPath();ctx.arc(0,0,R*1.6,0,7);ctx.fill();
  gs=ctx.createRadialGradient(0,0,0,0,0,R*1.1);gs.addColorStop(0,'rgba(0,0,0,.5)');gs.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gs;ctx.beginPath();ctx.arc(0,0,R*1.1,0,7);ctx.fill();ctx.restore()}
 // halo (corazón)
 if(T.glow>0){const g=ctx.createRadialGradient(cx,cy,R*.6,cx,cy,R*(2.3+.2*Math.sin(t*2.4)));g.addColorStop(0,hexA('#FF00B2',.5*Math.min(1,T.glow)));g.addColorStop(.6,hexA('#FF4F7A',.15*T.glow));g.addColorStop(1,hexA('#FF00B2',0));ctx.fillStyle=g;ctx.fillRect(cx-size,cy-size,size*2,size*2)}
 // ondas (agua)
 if(T.ripples>0){ctx.strokeStyle=hexA('#4F8FEF',.6);ctx.lineWidth=size*.004;for(let i=0;i<3;i++){const f=((t*.3+i/3)%1);ctx.globalAlpha=(1-f)*.7*Math.min(1,T.ripples);ctx.beginPath();ctx.arc(cx,cy,R*(1.1+f*1.4),0,7);ctx.stroke()}ctx.globalAlpha=1}
 // filamentos (aire)
 if(T.filaments>0&&!A3){const n=Math.round(T.filaments);ctx.strokeStyle=hexA('#4F8FEF',.55);ctx.lineWidth=size*.0025;ctx.lineCap='round';
  for(let i=0;i<n;i++){const a0=i/n*Math.PI*2+seed*.01;ctx.beginPath();for(let k=0;k<=40;k++){const f=k/40;const a=a0+f*1.6+.25*Math.sin(t*.8+i+f*6);const d=R*(1.05+f*1.6);k?ctx.lineTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d):ctx.moveTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d)}ctx.stroke()}}
 // estela de puntos (fuego)
 if(T.dots>0&&!A3){const n=Math.round(T.dots);const a0=t*(.15+.5*T.spin)+seed;for(let i=0;i<n;i++){const f=i/n;const a=a0+f*Math.PI*1.8;const d=R*(1.35+f*1.1);const r=R*.13*(1-f)+1.2;ctx.fillStyle='#FF2A00';ctx.beginPath();ctx.arc(cx+Math.cos(a)*d,cy+Math.sin(a)*d,r,0,7);ctx.fill()}}
 // rueda (tierra)
 if(T.wheels>0&&!A3){ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.6);ctx.strokeStyle=BL;ctx.lineWidth=size*.006;ctx.globalAlpha=Math.min(1,T.wheels);ctx.beginPath();ctx.arc(0,0,R*1.55,0,7);ctx.stroke();ctx.lineWidth=size*.003;for(let i=0;i<16;i++){const a=i/16*Math.PI*2;ctx.beginPath();ctx.moveTo(Math.cos(a)*R*.5,Math.sin(a)*R*.5);ctx.lineTo(Math.cos(a)*R*1.55,Math.sin(a)*R*1.55);ctx.stroke()}ctx.restore()}
 // cuadrados anidados (agua)
 if(T.squares>0&&!A3){ctx.save();ctx.translate(cx,cy);ctx.strokeStyle=OUT;ctx.lineWidth=size*.003;ctx.globalAlpha=Math.min(1,T.squares)*.85;for(let i=0;i<3;i++){ctx.save();ctx.rotate(t*.2*(i%2?-1:1)+i*.4);const s=R*(1.5+i*.35);ctx.strokeRect(-s,-s,s*2,s*2);ctx.restore()}ctx.restore()}
 // rombos (fuego)
 if(T.diamonds>0&&!A3){const n=Math.round(T.diamonds);ctx.strokeStyle=OUT;ctx.lineWidth=size*.004;for(let i=0;i<n;i++){const a=Math.PI*.75+i*2.3;const d=R*1.75;const x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d;const s=R*.32;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t+i)*.2);for(let k=0;k<3;k++){const q=s*(1-k*.3);ctx.beginPath();ctx.moveTo(0,-q);ctx.lineTo(q*.7,0);ctx.lineTo(0,q);ctx.lineTo(-q*.7,0);ctx.closePath();ctx.stroke()}ctx.restore()}}
 // púas (corazón)
 if(T.spikes>0&&!A3){const n=Math.round(T.spikes);ctx.save();ctx.shadowColor='#FF00B2';ctx.shadowBlur=size*.02;ctx.fillStyle='#FF00B2';for(let i=0;i<n;i++){const a=i/n*Math.PI*2+seed*.01+t*.08*T.spin;const len=R*1.3*(1+.08*Math.sin(t*1.7+i));const w=R*.18;const sx=cx+Math.cos(a)*R*.7,sy=cy+Math.sin(a)*R*.7;const tx=cx+Math.cos(a)*(R*.7+len),ty=cy+Math.sin(a)*(R*.7+len);const px=-Math.sin(a)*w,py=Math.cos(a)*w;ctx.beginPath();ctx.moveTo(sx+px,sy+py);ctx.lineTo(tx,ty);ctx.lineTo(sx-px,sy-py);ctx.closePath();ctx.fill()}ctx.restore()}
 // raíces y ramas (tierra)
 if((T.fibers>0||T.branches>0)&&!A3){ctx.strokeStyle=hexA(OUT,.85);ctx.lineWidth=Math.max(1.2,size*.0045);ctx.lineCap='round';
  const n=Math.round(T.fibers);for(let i=0;i<n;i++){const a=rr()*Math.PI*2;const l=R*(.5+rr()*1.1);const k=(rr()-.5)*.8;const x0=cx+Math.cos(a)*R*.85,y0=cy+Math.sin(a)*R*.85;const x1=cx+Math.cos(a+k*.4)*(R*.85+l),y1=cy+Math.sin(a+k*.4)*(R*.85+l);const mx=cx+Math.cos(a+k)*(R*.85+l*.5),my=cy+Math.sin(a+k)*(R*.85+l*.5);ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo(mx,my,x1,y1);ctx.stroke()}
  const b=Math.round(T.branches);const r2=rnd(seed+21);const branch=(x,y,a,l,d)=>{if(d>3||l<R*.1)return;const x1=x+Math.cos(a)*l,y1=y+Math.sin(a)*l;ctx.lineWidth=Math.max(.8,size*.004*(1-d*.25));ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x1,y1);ctx.stroke();branch(x1,y1,a-.5+r2()*.3,l*.65,d+1);branch(x1,y1,a+.5-r2()*.3,l*.65,d+1)};
  for(let i=0;i<b;i++){const a=-Math.PI/2+i*1.9+seed*.02;branch(cx+Math.cos(a)*R*.9,cy+Math.sin(a)*R*.9,a,R*.9,0)}}
 // alas libélula (aire)

const ZONES=[
 {label:'Stand',c:'fuego',x:378,y:602},{label:'Stand',c:'fuego',x:1130,y:523},{label:'Stand',c:'fuego',x:1435,y:513},

// plano base: se toma el dibujo original, se le quitan los recuadros y se pasa a tonos oscuros
let MAP_BASE=null;
function buildMapBase(img){
 const c=document.createElement('canvas');c.width=MAP_W;c.height=MAP_H;const x=c.getContext('2d',{willReadFrequently:true});x.fillStyle='#fff';x.fillRect(0,0,MAP_W,MAP_H);x.drawImage(img,0,0,MAP_W,MAP_H);
 const id=x.getImageData(0,0,MAP_W,MAP_H),d=id.data;
 // 1) borrar los recuadros interpolando desde sus bordes
 for(const z of ZONES){const hw=(z.w||130)/2+9,hh=(z.h||95)/2+9;const x0=Math.max(1,Math.round(z.x-hw)),x1=Math.min(MAP_W-2,Math.round(z.x+hw)),y0=Math.max(1,Math.round(z.y-hh)),y1=Math.min(MAP_H-2,Math.round(z.y+hh));
  for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){
   const fx=(xx-x0)/(x1-x0||1),fy=(yy-y0)/(y1-y0||1),o=(yy*MAP_W+xx)*4;
   const L=((yy*MAP_W)+(x0-1))*4,R=((yy*MAP_W)+(x1+1))*4,T=(((y0-1)*MAP_W)+xx)*4,B=(((y1+1)*MAP_W)+xx)*4;
   for(let k=0;k<3;k++){const h=d[L+k]*(1-fx)+d[R+k]*fx,v=d[T+k]*(1-fy)+d[B+k]*fy;d[o+k]=(h+v)/2}d[o+3]=255}}
 // 2) pasar a oscuro según el tipo de superficie: suelo, agua o verde
 const rgb2hsl=(r,g,b)=>{r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const dd=mx-mn;s=l>.5?dd/(2-mx-mn):dd/(mx+mn);h=mx===r?(g-b)/dd+(g<b?6:0):mx===g?(b-r)/dd+2:(r-g)/dd+4;h*=60}return[h,s,l]};
 for(let i=0;i<d.length;i+=4){const [h,s,l]=rgb2hsl(d[i],d[i+1],d[i+2]);let r,g,b;
  if(l>.9&&s<.25){r=27;g=27;b=34}                                   // suelo
  else if(h>=165&&h<=215&&s>.12){const k=.6+l*.75;r=16*k;g=62*k;b=76*k}   // agua
  else if(h>=50&&h<165&&s>.1){const k=.4+l*.9;r=22*k;g=62*k;b=38*k}    // verde
  else{const k=.25+l*.5;r=d[i]*k;g=d[i+1]*k;b=d[i+2]*k}
  d[i]=r;d[i+1]=g;d[i+2]=b}
 x.putImageData(id,0,0);
 // 2b) suavizar el hueco de cada recuadro para que no quede su silueta
 for(const z of ZONES){const hw=(z.w||130)/2+9,hh=(z.h||95)/2+9,pad=46,sw=Math.round(2*(hw+pad)),sh=Math.round(2*(hh+pad)),sx=Math.round(z.x-sw/2),sy=Math.round(z.y-sh/2);
  const t=document.createElement('canvas');t.width=sw;t.height=sh;const tc=t.getContext('2d');tc.filter='blur(16px)';tc.drawImage(c,sx,sy,sw,sh,0,0,sw,sh);tc.filter='none';
  tc.globalCompositeOperation='destination-in';const g=tc.createRadialGradient(sw/2,sh/2,Math.min(hw,hh)*.7,sw/2,sh/2,Math.min(sw,sh)/2);g.addColorStop(0,'#000');g.addColorStop(1,'rgba(0,0,0,0)');tc.fillStyle=g;tc.fillRect(0,0,sw,sh);
  x.drawImage(t,sx,sy)}
 // 3) pintar las zonas por encima del plano
 const rr=rnd(77);
 for(const z of ZONES){const col=ZONE_COL[z.c],rx=(z.w||130)/2+62,ry=(z.h||95)/2+62;
  const ph=[rr()*6,rr()*6,rr()*6];const pts=[];for(let k=0;k<72;k++){const a=k/72*Math.PI*2;const m=1+.1*Math.sin(3*a+ph[0])+.06*Math.sin(5*a+ph[1])+.04*Math.sin(7*a+ph[2]);pts.push([z.x+Math.cos(a)*rx*m,z.y+Math.sin(a)*ry*m])}
  x.save();x.shadowColor=hexA(col,.5);x.shadowBlur=40;x.beginPath();pts.forEach((p,k)=>k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();
  const g=x.createRadialGradient(z.x,z.y,rx*.1,z.x,z.y,rx*1.05);g.addColorStop(0,hexA(col,.3));g.addColorStop(.6,hexA(col,.2));g.addColorStop(1,hexA(col,.08));x.fillStyle=g;x.fill();
  x.shadowBlur=0;x.lineWidth=2;x.strokeStyle=hexA(col,.22);x.stroke();x.restore()}
 return c}

 document.querySelectorAll('.sheet').forEach(x=>x.remove());
 let sym=null,num=null;
 const sh=el(`<div class="sheet"><div class="panel power"><div class="grab"></div>
  <div class="eyebrow">Escondido en la feria</div>
  <h2>Superpoder</h2>
  <p>Si encontraste uno de estos símbolos en un cartel, elegilo y sumale el número que lo acompaña. Probá y mirá qué le pasa a tu semilla.</p>
  <div class="lbl">Símbolo</div><div class="row5">${SYMS.map(([n])=>`<button class="pick" data-s="${n}" type="button"><canvas class="g"></canvas><small>${n}</small></button>`).join('')}</div>
  <div class="lbl">Número</div><div class="row9">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="pick" data-n="${n}" type="button">${n}</button>`).join('')}</div>
  <div class="msg" id="pmsg"></div>
  <div class="choices pw-act"><button class="btn primary" id="pgo" type="button">Activar</button>
  <button class="btn close" type="button">Ahora no</button></div></div></div>`);
 const msg=sh.querySelector('#pmsg');
 const drawIcons=()=>sh.querySelectorAll('[data-s]').forEach(b=>{const d=SYMS.find(x=>x[0]===b.dataset.s),c=b.querySelector('canvas');setupCanvas(c,52,52);const x=c.getContext('2d');x.setTransform(c._dpr,0,0,c._dpr,0,0);const fx={...FX};FX={dentA:0,dentM:0,squash:0,bubble:0};draw(x,52,{...BASE,core:1,...d[1]},1.2,d[2],7,null);FX=fx});drawIcons();
 sh.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sym=b.dataset.s;sh.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('sel',x===b));msg.textContent=''});
 sh.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{num=b.dataset.n;sh.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('sel',x===b));msg.textContent=''});
 sh.querySelector('#pgo').onclick=()=>{
  if(!sym||!num){msg.textContent='Elegí un símbolo y un número.';return}
  const p=POWERS[sym+num];
  if(!p){msg.textContent='Esa combinación no hace nada. Probá con otro cartel.';return}
  sh.remove();toast(p[0]);setTimeout(()=>runPower(p[1]),300);setTimeout(refugioNudge,300+({spin:6500,shrink:4600,flash:3800,pulse:4600,confetti:4000})[p[1]])};
 sh.querySelector('.close').onclick=()=>sh.remove();sh.onclick=e=>{if(e.target===sh)sh.remove()};document.body.appendChild(sh);
}
function openConcept(cpt){
 document.querySelectorAll('.sheet').forEach(x=>x.remove());
 const sh=el(`<div class="sheet"><div class="panel"><div class="grab"></div>
  <div class="eyebrow" style="color:${cpt.color===('#EFD74F')||cpt.color==='#79F2F4'?'var(--mute)':cpt.color}">${cpt.name} · catalizador</div>
  <h2>${wordHTML(cpt,3)}</h2><p>${cpt.intro} Elegí qué te pasa.</p><div class="opts"></div>
  <button class="close" type="button">Ahora no</button></div></div>`);
 const opts=sh.querySelector('.opts');
 cpt.elements.forEach((o,i)=>{
  const b=el(`<button class="opt ${i===4?'full':''}" type="button"><canvas></canvas><span><b>${o.label}</b><small>${o.desc}</small></span></button>`);
  const pc=b.querySelector('canvas');setupCanvas(pc,92,92);const T={...S.traits};for(const k in o.delta)T[k]=(T[k]||0)+o.delta[k];
  const mix={...S.mix};mix[cpt.id]=(mix[cpt.id]||0)+1;const x=pc.getContext('2d');x.setTransform(pc._dpr,0,0,pc._dpr,0,0);
  const fx={...FX};FX={dentA:0,dentM:0,squash:0,bubble:0};draw(x,92,T,1.2,mix,S.seed,null);FX=fx;
  b.onclick=()=>{apply(cpt,o);sh.remove()};opts.appendChild(b)});
 sh.querySelector('.close').onclick=()=>sh.remove();sh.onclick=e=>{if(e.target===sh)sh.remove()};document.body.appendChild(sh);
}
function apply(cpt,o){
 for(const k in o.delta)S.traits[k]=(S.traits[k]||0)+o.delta[k];
 S.mix[cpt.id]=(S.mix[cpt.id]||0)+1;
 const before=stageOf(S.history.length)[1];
 S.history.push({c:cpt.id,e:o.label,t:Date.now()});save();
 renderHome();
 const [x,y]=orgCenter();burst(cpt.color,80,x,y);V.scaleV+=2.5;V.rotV+=(Math.random()-.5)*6;V.vx+=(Math.random()-.5)*300;V.vy+=(Math.random()-.5)*300;
 const w=document.getElementById('word');w.innerHTML=wordHTML(cpt,S.history.length);requestAnimationFrame(()=>w.classList.add('show'));setTimeout(()=>w.classList.remove('show'),1500);
 const after=stageOf(S.history.length)[1];
 if(after!==before){const fin=STAGES[STAGES.length-1][1];if(after===fin)setTimeout(openCongrats,1300);else setTimeout(()=>toast(`¡Pasaste a ${after}!`),900)}
}
function openCongrats(){
 document.querySelectorAll('.sheet').forEach(x=>x.remove());
 const sh=el(`<div class="sheet"><div class="panel congrats"><div class="grab"></div>
  <div class="eyebrow">Etapa final</div>
  <h2>¡Felicitaciones!</h2>

 document.body.appendChild(sh);const [x,y]=orgCenter();for(const c of CONCEPTS)burst(c.color,24,x,y);
}

}
